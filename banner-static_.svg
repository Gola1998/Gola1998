<svg width="1500" height="500" viewBox="0 0 1500 500" xmlns="http://www.w3.org/2000/svg">

  <!-- Background -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070B14"></stop>
      <stop offset="50%" stop-color="#0B1220"></stop>
      <stop offset="100%" stop-color="#020617"></stop>
    </linearGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="10" result="blur"></feGaussianBlur>
      <feMerge>
        <feMergeNode in="blur"></feMergeNode>
        <feMergeNode in="SourceGraphic"></feMergeNode>
      </feMerge>
    </filter>
  </defs>

  <rect width="1500" height="500" fill="url(#bg)"></rect>

  <!-- Soft grid -->
  <g opacity="0.05">
    <path d="M0 100 H1500 M0 200 H1500 M0 300 H1500 M0 400 H1500" stroke="#94a3b8"></path>
    <path d="M200 0 V500 M400 0 V500 M600 0 V500 M800 0 V500 M1000 0 V500 M1200 0 V500 M1400 0 V500" stroke="#94a3b8"></path>
  </g>

  <!-- Glow shapes -->
  <circle cx="1250" cy="120" r="160" fill="#3b82f6" opacity="0.12"></circle>
  <circle cx="1100" cy="380" r="220" fill="#22d3ee" opacity="0.08"></circle>

  <!-- Name -->
  <text x="120" y="190" font-size="78" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-weight="800">
    Gaurav
  </text>

  <!-- Role -->
  <text x="120" y="255" font-size="34" fill="#60a5fa" font-family="Inter, Arial, sans-serif" font-weight="500">
    Frontend Developer
  </text>

  <!-- Divider -->
  <line x1="120" y1="275" x2="650" y2="275" stroke="#3b82f6" stroke-width="2" opacity="0.5"></line>

  <!-- Tech stack -->
  <text x="120" y="330" font-size="22" fill="#cbd5e1" font-family="Inter, Arial, sans-serif">
    React.js • JavaScript • Redux Toolkit • Tailwind CSS • Firebase
  </text>

  <!-- Experience -->
  <text x="120" y="375" font-size="20" fill="#94a3b8" font-family="Inter, Arial, sans-serif">
    1.5+ Years Experience • UI Engineering • API Integration • Performance Optimization
  </text>

  <!-- Right-side highlight -->
  <g filter="url(#glow)">
    <text x="950" y="250" font-size="22" fill="#38bdf8" font-family="Inter, Arial, sans-serif">
      React • Clean UI • Scalable Systems
    </text>
  </g>

</svg>